[project]
name = "granton-dataspell"
version = "0.1.0"
description = "Reporting notebooks for Granton billing, KPI and export workflows (Aquila, Andromeda, Jira)."
authors = [{ name = "Josef Polach", email = "josef.polach@granton.cz" }]
readme = "README.md"
license = "LicenseRef-Proprietary"

# Pinned to the interpreter of the existing conda env:
#   /home/josef/.conda/envs/grt-dataspell  (Python 3.11.15)
requires-python = ">=3.11,<3.13"

dependencies = [
    # ── Data & analysis ──────────────────────────────────────
    "pandas (>=3.0.2,<4.0.0)",
    "numpy (>=2.4.4,<3.0.0)",

    # ── Charting ─────────────────────────────────────────────
    "matplotlib (>=3.10.8,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",

    # ── Data sources ─────────────────────────────────────────
    # psycopg2-binary (not psycopg2) — ships wheels, needs no local
    # libpq or C compiler.
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "requests (>=2.33.1,<3.0.0)",

    # ── Excel export (sdesk_export, KPIs) ────────────────────
    "openpyxl (>=3.1.5,<4.0.0)",

    # ── Configuration ────────────────────────────────────────
    # Loads the git-ignored .env at the repo root. Every notebook
    # depends on this — without it the config cells raise.
    "python-dotenv (>=1.2.2,<2.0.0)",
]

[tool.poetry]
# This repo is a collection of notebooks, not an importable package.
package-mode = false

# The notebook runtime itself. Present in the conda env today; grouped so a
# headless install can skip it with `poetry install --without notebook`.
[tool.poetry.group.notebook.dependencies]
jupyterlab = "^4.5.6"
notebook = "^7.5.5"
ipykernel = "^7.2.0"

# Used to execute notebooks non-interactively (CI, smoke tests):
#   poetry run jupyter nbconvert --to notebook --execute <notebook>
[tool.poetry.group.dev.dependencies]
nbconvert = "^7.17.1"
nbformat = "^5.10.4"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
